[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-engineering-production-observability"
version = "0.1.0"
description = "Production operational observability for AI-generated engineering changes."
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
]

[project.optional-dependencies]
azure = [
    "azure-monitor-opentelemetry>=1.6,<2",
]

dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
operational-observability = "ai_engineering_observability.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engineering_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
