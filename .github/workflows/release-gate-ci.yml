name: Release Gate

on:
  push:
    paths:
      - ".gitignore"
      - "release-gate/**"
      - "!release-gate/demo/*.html"
      - "!release-gate/**/*.md"
      - "!release-gate/**/README*"
      - ".github/workflows/release-gate-ci.yml"
      - ".github/workflows/release-gate-release.yml"
  pull_request:
    paths:
      - ".gitignore"
      - "release-gate/**"
      - "!release-gate/demo/*.html"
      - "!release-gate/**/*.md"
      - "!release-gate/**/README*"
      - ".github/workflows/release-gate-ci.yml"
      - ".github/workflows/release-gate-release.yml"

concurrency:
  group: release-gate-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: release-gate
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # astral-sh/setup-uv v8.1.0; upgrade only with reviewed lock/tool changes.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python }}
          version: "0.12.5"
      - name: Install package and development dependencies
        run: uv sync --all-groups --locked
      - name: Test
        run: uv run pytest --cov=release_gate --cov-report=term-missing -q
      - name: Type check
        run: uv run mypy src/release_gate
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Check packaged schemas
        run: uv run python scripts/sync_schemas.py
      - name: Check generated release version surfaces
        run: uv run python scripts/sync_release_version.py --check
      - name: Build wheel and source distribution from locked backend
        run: uv run python -m build --no-isolation
      - name: Smoke-test installed wheel
        run: uv run python scripts/smoke_installed.py
      - name: Validate portable skill
        run: uv run python tests/validate_skill.py
      - name: Validate pending qualification template shape
        run: >-
          uv run python scripts/validate_qualification.py
          qualification/release-gate-v0.6.0-rc.1.pending.json
          --expected-tag release-gate-v0.6.0-rc.1
          --allow-pending-schema-only
      - name: Build deterministic skill archives twice
        shell: bash
        run: |
          uv run python scripts/build_skill_archives.py --output-dir "${RUNNER_TEMP}/skills-first"
          uv run python scripts/build_skill_archives.py --output-dir "${RUNNER_TEMP}/skills-second"
          diff -r "${RUNNER_TEMP}/skills-first" "${RUNNER_TEMP}/skills-second"

  python-slugify-demo:
    name: python-slugify demo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # astral-sh/setup-uv v8.1.0; upgrade only with reviewed lock/tool changes.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          version: "0.12.5"
      - name: Install Release Gate from this checkout
        run: uv tool install ./release-gate
      - name: Verify PASS, FAIL, and NEEDS_HUMAN controls
        run: python release-gate/demo/python-slugify/demo.py verify

  rate-limiter-demo:
    name: rate-limiter demo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # astral-sh/setup-uv v8.1.0; upgrade only with reviewed lock/tool changes.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          version: "0.12.5"
      - name: Install Release Gate from this checkout
        run: uv tool install ./release-gate
      - name: Verify oracle and PASS, FAIL, and NEEDS_HUMAN controls
        run: python release-gate/demo/rate-limiter/demo.py verify
