name: Release Gate

on:
  push:
    paths:
      - "release-gate/**"
      - ".github/workflows/release-gate-ci.yml"
  pull_request:
    paths:
      - "release-gate/**"
      - ".github/workflows/release-gate-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: release-gate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development dependencies
        run: uv sync --all-groups
      - name: Test
        run: uv run pytest --cov=release_gate --cov-report=term-missing -q
      - name: Type check
        run: uv run mypy src/release_gate
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Check packaged schemas
        run: uv run python scripts/sync_schemas.py
      - name: Build wheel and source distribution
        run: uv run python -m build
      - name: Smoke-test installed wheel
        run: uv run python scripts/smoke_installed.py
      - name: Validate portable skill
        run: uv run python tests/validate_skill.py
