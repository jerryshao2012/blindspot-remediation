# B4 dependency/test fragment.
#
# Merge these settings into the repository's canonical pyproject.toml rather
# than creating a second permanent project configuration file.
#
# No AI SDK is required for the deterministic B4 E2E test.
[project]
requires-python = ">=3.11"
[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

