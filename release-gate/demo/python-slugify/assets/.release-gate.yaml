version: 1

scope:
  allowed_paths:
    - "/setup.py"
    - "slugify/**"
    - "/README.md"
    - "/tox.ini"
  forbidden_paths:
    - "/test.py"
    - ".github/**"
  review_required_paths:
    - "/.release-gate.yaml"
    - "/.release-gate-venv/"
    - "/SECURITY.md"
    - "/LICENSE*"

prepare:
  - id: create-demo-venv
    argv:
      - "python3"
      - "-m"
      - "venv"
      - ".release-gate-venv"
    cwd: "."
    timeout: 600
    inherit_environment: ["PATH"]
    exit_classes:
      pass: [0]
      fail: [1]
      error: []
    platform:
      windows:
        argv:
          - "py"
          - "-3"
          - "-m"
          - "venv"
          - ".release-gate-venv"
        inherit_environment: ["PATH", "PATHEXT", "SYSTEMROOT"]

  - id: install-demo-dependencies
    argv:
      - ".release-gate-venv/bin/python"
      - "-m"
      - "pip"
      - "install"
      - "--disable-pip-version-check"
      - "."
      - "pytest==8.4.2"
      - "pytest-cov==6.3.0"
      - "mypy==1.20.2"
    cwd: "."
    timeout: 600
    inherit_environment: ["PATH"]
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    exit_classes:
      pass: [0]
      fail: [1]
      error: []
    platform:
      windows:
        argv:
          - ".release-gate-venv/Scripts/python.exe"
          - "-m"
          - "pip"
          - "install"
          - "--disable-pip-version-check"
          - "."
          - "pytest==8.4.2"
          - "pytest-cov==6.3.0"
          - "mypy==1.20.2"
        inherit_environment: ["PATH", "PATHEXT", "SYSTEMROOT"]

limits:
  stream_bytes: 1048576
  report_bytes: 5242880
  total_bytes: 209715200

checks:
  - id: tests-and-coverage
    mode: differential
    severity: blocking
    argv:
      - ".release-gate-venv/bin/python"
      - "-m"
      - "pytest"
      - "test.py"
      - "-q"
      - "-p"
      - "no:cacheprovider"
      - "--junitxml=junit.xml"
      - "--cov=slugify"
      - "--cov-report=json:coverage.json"
    cwd: "."
    timeout: 600
    inherit_environment: ["PATH"]
    environment:
      CI: "true"
    exit_classes:
      pass: [0]
      fail: [1]
      error: [2, 3, 4, 5]
    platform:
      windows:
        argv:
          - ".release-gate-venv/Scripts/python.exe"
          - "-m"
          - "pytest"
          - "test.py"
          - "-q"
          - "-p"
          - "no:cacheprovider"
          - "--junitxml=junit.xml"
          - "--cov=slugify"
          - "--cov-report=json:coverage.json"
        inherit_environment: ["PATH", "PATHEXT", "SYSTEMROOT"]
    reports:
      - id: junit
        parser: junit-xml
        path: junit.xml
        required: true
      - id: coverage
        parser: coverage-json
        path: coverage.json
        required: true
    assertions:
      - report: junit
        metric: /failures
        comparison: candidate-minus-baseline
        operator: lte
        value: 0
      - report: junit
        metric: /errors
        comparison: candidate-minus-baseline
        operator: lte
        value: 0
      - report: coverage
        metric: /percent_covered
        comparison: candidate
        operator: gte
        value: 85
      - report: coverage
        metric: /percent_covered
        comparison: candidate-minus-baseline
        operator: gte
        value: -1

  - id: task-consistency
    mode: candidate
    severity: blocking
    argv:
      - ".release-gate-venv/bin/python"
      - "-c"
      - >-
        import json; from pathlib import Path;
        files = [Path('setup.py'), Path('README.md'), Path('tox.ini'), Path('slugify/slugify.py')];
        names = ('text-unidecode', 'text_unidecode');
        remaining = sum(path.read_text(encoding='utf-8').count(name) for path in files for name in names);
        Path('task-consistency.json').write_text(json.dumps({'remaining': remaining}), encoding='utf-8')
    cwd: "."
    timeout: 60
    inherit_environment: ["PATH"]
    exit_classes:
      pass: [0]
      fail: [1]
      error: []
    platform:
      windows:
        argv:
          - ".release-gate-venv/Scripts/python.exe"
          - "-c"
          - >-
            import json; from pathlib import Path;
            files = [Path('setup.py'), Path('README.md'), Path('tox.ini'), Path('slugify/slugify.py')];
            names = ('text-unidecode', 'text_unidecode');
            remaining = sum(path.read_text(encoding='utf-8').count(name) for path in files for name in names);
            Path('task-consistency.json').write_text(json.dumps({'remaining': remaining}), encoding='utf-8')
        inherit_environment: ["PATH", "PATHEXT", "SYSTEMROOT"]
    reports:
      - id: consistency
        parser: json-metrics
        path: task-consistency.json
        required: true
    assertions:
      - report: consistency
        metric: /remaining
        comparison: candidate
        operator: eq
        value: 0

  - id: types
    mode: candidate
    severity: advisory
    argv:
      - ".release-gate-venv/bin/python"
      - "-m"
      - "mypy"
      - "slugify"
      - "--ignore-missing-imports"
    cwd: "."
    timeout: 300
    inherit_environment: ["PATH"]
    exit_classes:
      pass: [0]
      fail: [1]
      error: [2]
    platform:
      windows:
        argv:
          - ".release-gate-venv/Scripts/python.exe"
          - "-m"
          - "mypy"
          - "slugify"
          - "--ignore-missing-imports"
        inherit_environment: ["PATH", "PATHEXT", "SYSTEMROOT"]
