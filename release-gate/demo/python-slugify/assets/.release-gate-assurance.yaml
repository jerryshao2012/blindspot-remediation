version: 1
mode: advisory
concept_schema:
  schema_id: python-slugify-behavior
  schema_version: 1.1.0
  dimensions:
    - dimension_id: behavior_region
      name: Behavior region
      definition: The python-slugify behavior exercised by a reviewed upstream test.
      values:
        - transliteration
        - unicode
        - boundary
        - customization
        - cli_contract
    - dimension_id: failure_mode
      name: Failure mode
      definition: >-
        A known X1 failure mode that passing, reviewed evidence guards against.
        Only MAPPED failure modes appear here; substituted, unavailable, and
        not-applicable layers are never listed, so they cannot be counted.
      values:
        - public_api_regression
        - import_declaration_mismatch
        - incomplete_migration
        - type_regression
