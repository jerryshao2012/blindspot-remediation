[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "release-gate"
dynamic = ["version"]
description = "A repository-neutral, evidence-producing release gate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Blindspot Remediation contributors" }]
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
  "jsonschema[format]>=4.25,<5",
  "pathspec==1.1.1",
  "psutil>=7.0,<8",
  "defusedxml>=0.7,<1",
]

[project.urls]
Homepage = "https://github.com/jerryshao2012/blindspot-remediation/tree/main/release-gate"
Repository = "https://github.com/jerryshao2012/blindspot-remediation"
Documentation = "https://github.com/jerryshao2012/blindspot-remediation/tree/main/release-gate/docs"
Issues = "https://github.com/jerryshao2012/blindspot-remediation/issues"
Support = "https://github.com/jerryshao2012/blindspot-remediation/issues"
Security = "https://github.com/jerryshao2012/blindspot-remediation/security/advisories/new"

[project.scripts]
release-gate = "release_gate.cli:main"

[tool.hatch.version]
path = "src/release_gate/__init__.py"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling==1.32.0",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-psutil>=7.0,<8",
  "types-jsonschema>=4.25,<5",
  "types-defusedxml>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/release_gate"]

[tool.hatch.build.targets.sdist]
exclude = ["/demo/python-slugify/workbench"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:GitWildMatchPattern .* is deprecated:DeprecationWarning:pathspec.*",
]

[tool.coverage.run]
branch = true
source = ["release_gate"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["release_gate"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
