# ---------------------------------------------------------------------------
# EXAMPLE POC QUALIFICATION POLICY
# ---------------------------------------------------------------------------
#
# THESE VALUES ARE NOT CLAIMED TO BE BMO PRODUCTION THRESHOLDS.
#
# They exist so that the implementation has complete executable semantics
# rather than hidden placeholders.
#
# Production thresholds must eventually be calibrated according to:
#
#   task risk
#   downstream impact
#   human oversight
#   reversibility
#   task complexity
#   benchmark representativeness
#   organizational risk appetite
#
# An important design decision:
#
# We gate on CONFIDENCE BOUNDS rather than only observed point estimates.
#
# Thus:
#
#   10/10 successful tasks
#
# does not automatically satisfy:
#
#   true reliability >= 95%
#
# because ten observations do not support such a strong statistical claim.

confidence_level: 0.95

policy:
  policy_version: "poc-1.0"

  minimum_gradable_cases: 100

  # Lower confidence bound for overall task success.
  minimum_task_success_lower_bound: 0.80

  # Among candidates the gate actually releases, we want strong evidence that
  # they are correct.
  minimum_safe_release_lower_bound: 0.90

  # False release is especially important:
  #
  # candidate incorrect
  #       +
  # gate says PASS
  #
  # The UPPER confidence bound must remain below this threshold.
  maximum_false_release_upper_bound: 0.10

  maximum_ungradable_fraction: 0.05

  maximum_pipeline_error_fraction: 0.05
